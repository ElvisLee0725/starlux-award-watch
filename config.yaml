# Starlux award watch — search definitions and behavior.
# Edit freely; no code changes needed to add/remove searches.

searches:
  # The high-value targets: Asia -> North America, single saver seat at 75k.
  - name: "TPE->LAX Starlux business (saver)"
    origin: TPE
    destination: LAX
    carrier: JX          # Starlux only
    cabin: business       # economy | premium | business | first
    max_miles: 75000      # alert only when per-person price <= this
    max_taxes_usd: 200
    passengers: 1
    nonstop_only: true

  - name: "TPE->ONT Starlux business (saver)"
    origin: TPE
    destination: ONT
    carrier: JX
    cabin: business
    max_miles: 75000
    max_taxes_usd: 200
    passengers: 1
    nonstop_only: true

  # Reverse direction — kept on, will simply never alert if it stays above 75k.
  - name: "LAX->TPE Starlux business (saver)"
    origin: LAX
    destination: TPE
    carrier: JX
    cabin: business
    max_miles: 75000
    max_taxes_usd: 200
    passengers: 1
    nonstop_only: true

  - name: "ONT->TPE Starlux business (saver)"
    origin: ONT
    destination: TPE
    carrier: JX
    cabin: business
    max_miles: 75000
    max_taxes_usd: 200
    passengers: 1
    nonstop_only: true

# How far ahead to scan. Alaska opens partner award space ~330 days out;
# occasionally Starlux loads closer to 350. We probe to max_days_ahead and
# stop early on the first "no schedule" response.
window:
  min_days_ahead: 1
  max_days_ahead: 331

# Polling. A full sweep = one month-calendar load per route-month (~12/route)
# plus a full-results confirmation for each day the calendar flags at/under
# max_miles. The far-edge pass re-checks only the newest bookable dates
# frequently, because that's where the lone saver seat appears first.
poll:
  full_sweep_minutes: 120
  far_edge_minutes: 20
  far_edge_days: 21           # "newest" = last N days of the window
  jitter_pct: 0.3             # randomize each interval +/- 30%
  request_delay_seconds: [8, 20]  # random pause between page loads (gentler = fewer CAPTCHAs)

alerts:
  channel: pushover           # pushover | sms | console
  renotify_after_hours: 12    # still available this many hours later -> alert again
  on_price_drop: true         # a seen date getting cheaper -> alert again
  quiet_hours: null           # e.g. [23, 7] to suppress night alerts (still logged)
  pushover_priority: 0        # 0 = normal (no red banner); 1 = high (red, bypasses quiet hours); 2 = emergency (nags until ack)
  pushover_retry_s: 60        # only used when priority is 2
  pushover_expire_s: 3600     # only used when priority is 2

browser:
  profile_dir: data/chrome-profile   # warmed by hand once (scripts/recon.py)
  headless: false                    # true on a headless server (needs xvfb)
  nav_timeout_ms: 45000
  challenge_cooldown_minutes: 30     # headless: pause a search this long after a CAPTCHA
  headed_challenge_wait_s: 180       # headed: wait this long for you to solve it in-window
  confirm_candidates: true           # load a day's full results to confirm nonstop JX
