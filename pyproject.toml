[project]
name = "starlux-award-watch"
version = "0.1.0"
description = "Watch the Alaska Airlines award calendar for Starlux (JX) business-class saver space and text me when it appears."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "curl-cffi>=0.7",
    "pydantic>=2.7",
    "twilio>=9.0",
    "apscheduler>=3.10",
    "structlog>=24.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
starlux-award-watch = "starlux_award_watch.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starlux_award_watch"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
